<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" font-family="'Segoe UI', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="800" height="780" fill="#fafafa"/>

  <!-- Header -->
  <text x="32" y="46" font-size="22" font-weight="700" fill="#1a1a1a">단체급식 프로모션</text>
  <text x="560" y="42" font-size="14" fill="#777777">홍길동님</text>
  <text x="668" y="42" font-size="14" fill="#777777" text-decoration="underline">로그아웃</text>
  <line x1="32" y1="64" x2="768" y2="64" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Register button (nutritionist only), black pill button like reference "GET STARTED" -->
  <rect x="584" y="84" width="184" height="48" rx="24" fill="#1a1a1a"/>
  <text x="676" y="114" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">프로모션 등록</text>
  <text x="768" y="150" font-size="11" fill="#aaaaaa" text-anchor="end">(영양사 로그인 시에만 노출)</text>

  <!-- Card 1 -->
  <g>
    <rect x="32" y="176" width="736" height="216" rx="24" fill="#ffffff" stroke="#ececec" stroke-width="1"/>
    <!-- orange header band, rounded top corners only -->
    <path d="M 56,176 H 744 Q 768,176 768,200 V 232 H 32 V 200 Q 32,176 56,176 Z"
          fill="#f4511e"/>
    <text x="56" y="210" font-size="12" font-weight="700" letter-spacing="2" fill="#ffffff">PROMOTION</text>
    <circle cx="726" cy="204" r="3" fill="#ffffff"/>
    <circle cx="738" cy="204" r="3" fill="#ffffff"/>
    <circle cx="750" cy="204" r="3" fill="#ffffff"/>

    <text x="56" y="266" font-size="19" font-weight="700" fill="#1a1a1a">여름 특별 급식 이벤트</text>

    <line x1="56" y1="286" x2="744" y2="286" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="6 5"/>

    <text x="56" y="316" font-size="11" font-weight="700" letter-spacing="1" fill="#999999">신청기간</text>
    <text x="56" y="340" font-size="15" font-weight="600" fill="#1a1a1a">2026-08-01 ~ 2026-08-20</text>

    <text x="420" y="316" font-size="11" font-weight="700" letter-spacing="1" fill="#999999">모집인원 / 신청인원</text>
    <text x="420" y="340" font-size="15" font-weight="600" fill="#1a1a1a">30명 / 12명</text>

    <rect x="600" y="356" width="168" height="40" rx="20" fill="#1a1a1a"/>
    <text x="684" y="381" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">상세보기</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="32" y="416" width="736" height="216" rx="24" fill="#ffffff" stroke="#ececec" stroke-width="1"/>
    <path d="M 56,416 H 744 Q 768,416 768,440 V 472 H 32 V 440 Q 32,416 56,416 Z"
          fill="#f4511e"/>
    <text x="56" y="450" font-size="12" font-weight="700" letter-spacing="2" fill="#ffffff">PROMOTION</text>
    <circle cx="726" cy="444" r="3" fill="#ffffff"/>
    <circle cx="738" cy="444" r="3" fill="#ffffff"/>
    <circle cx="750" cy="444" r="3" fill="#ffffff"/>
    <rect x="640" y="428" width="0" height="0"/>

    <text x="56" y="506" font-size="19" font-weight="700" fill="#1a1a1a">건강식단 체험단 모집</text>
    <rect x="668" y="486" width="68" height="26" rx="13" fill="#f0f0f0"/>
    <text x="702" y="503" font-size="12" font-weight="700" fill="#999999" text-anchor="middle">마감</text>

    <line x1="56" y1="526" x2="744" y2="526" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="6 5"/>

    <text x="56" y="556" font-size="11" font-weight="700" letter-spacing="1" fill="#999999">신청기간</text>
    <text x="56" y="580" font-size="15" font-weight="600" fill="#1a1a1a">2026-08-05 ~ 2026-08-15</text>

    <text x="420" y="556" font-size="11" font-weight="700" letter-spacing="1" fill="#999999">모집인원 / 신청인원</text>
    <text x="420" y="580" font-size="15" font-weight="600" fill="#1a1a1a">20명 / 20명</text>

    <rect x="600" y="596" width="168" height="40" rx="20" fill="#c9c9c9"/>
    <text x="684" y="621" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">상세보기</text>
  </g>

  <!-- more items indicator -->
  <rect x="32" y="656" width="736" height="60" rx="24" fill="none" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="400" y="692" font-size="14" fill="#bbbbbb" text-anchor="middle">···</text>

  <text x="32" y="756" font-size="12" fill="#999999">PromotionListPage — 카드 클릭 시 PromotionDetailPage로 이동 · 스타일 참고: 클로드 강의/스타일 폴더 이미지(라운드 카드 + 포인트 컬러 밴드 + 블랙 필 버튼)</text>
</svg>
